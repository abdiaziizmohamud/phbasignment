
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Form</title>
    <style>
     

    
    

  

        label, .field-title {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .radio-option {
            margin-right: 18px;
        }

     

    </style>
</head>
<body>

<main class="form-card">
    <h1>Student Form</h1>
    <p class="intro"><h2>Student Marks.</h2> </p>

    <form action="process.php" method="POST" enctype="multipart/form-data">
        <div class="field">
            <label for="student_name">Student Full Name</label>
            <input type="text" id="student_name" name="student_name" required>
        </div>

        <div class="field">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" required>
        </div>

        <div class="field">
            <span class="field-title">Gender</span>
            <label class="radio-option"><input type="radio" name="gender" value="Male" required> Male</label>
            <label class="radio-option"><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <div class="field">
            <label for="faculty">Faculty</label>
            <select id="faculty" name="faculty" required>
                <option value="">Select faculty</option>
                <option value="IT">Technology</option>
                <option value="Business">Business</option>
                <option value="Accounting">Accounting</option>
            </select>
        </div>

        <div class="field">
            <label for="php_mark">PHP Mark</label>
            <input type="number" id="php_mark" name="php_mark" min="0" max="100" step="any" required>
        </div>

        <div class="field">
            <label for="database_mark">Database Mark</label>
            <input type="number" id="database_mark" name="database_mark" min="0" max="100" step="any" required>
        </div>

        <div class="field">
            <label for="networking_mark">Networking Mark</label>
            <input type="number" id="networking_mark" name="networking_mark" min="0" max="100" step="any" required>
        </div>

        <div class="field">
            <label for="certificate">Student Certificate</label>
            <input type="file" id="certificate" name="certificate" accept=".pdf,.jpg,.jpeg,.png" required>
            <p class="help">Choose a PDF, JPG or PNG file (maximum size: 2 MB).</p>
        </div>

        <div class="buttons">
            <button class="submit-button" type="submit">Submit and Calculate</button>
            <button class="reset-button" type="reset">Reset Form</button>
        </div>
    </form>
</main>

</body>
</html>
